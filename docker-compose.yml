
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathwise-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      SUPABASE_URL: ${SUPABASE_URL:-https://lygsnlknbkochocevupx.supabase.co}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-handbooks}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - pathwise-uploads:/app/uploads
      - pathwise-uploads:/tmp/uploads/handbooks

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pathwise-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    depends_on:
      - backend

volumes:
  pathwise-uploads:
    driver: local
