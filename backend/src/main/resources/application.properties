spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pathwise}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Execute schema.sql to ensure seed districts, universities, and streams exist
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# HikariCP settings for Supabase connection pooling
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

# Multipart configuration for PDF upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# PathWise configuration
pathwise.upload.dir=${UPLOAD_DIR:/tmp/uploads/handbooks}
pathwise.gemini.api-key=${GEMINI_API_KEY:}
pathwise.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
